<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AIOps agent</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 42rem; }
    #log { border: 1px solid #ccc; min-height: 16rem; padding: 1rem; white-space: pre-wrap; }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input { flex: 1; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>AIOps agent</h1>
  <div id="log"></div>
  <form id="chat">
    <input id="message" placeholder="Check the cluster and fix what you can" autocomplete="off">
    <button type="submit">Send</button>
  </form>
  <script>
    const log = document.querySelector("#log");
    const api = localStorage.getItem("agentUrl") || "http://localhost:8080";
    document.querySelector("#chat").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.querySelector("#message");
      const message = input.value.trim();
      if (!message) return;
      log.textContent += "\n\nyou: " + message;
      input.value = "";
      const response = await fetch(api + "/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversationId: "operator", message })
      });
      const body = await response.json();
      log.textContent += "\nagent: " + (body.reply || JSON.stringify(body));
    });
  </script>
</body>
</html>
