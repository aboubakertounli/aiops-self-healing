spring:
  application:
    name: aiops-agent
  ai:
    openai:
      # OpenRouter: https://openrouter.ai/api and a :free model that supports tools.
      # Spring appends /v1/chat/completions, so the base URL must not already end in /v1.
      # Ollama on the CentOS GPU: http://172.16.99.1:11434 with key ollama.
      api-key: ${OPENAI_API_KEY:ollama}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
    mcp:
      client:
        type: SYNC
        streamable-http:
          connections:
            k8s-container-metrics:
              url: ${MCP_CONTAINER_METRICS_URL:http://localhost:8002}
              endpoint: /mcp
            k8s-cluster-openstack:
              url: ${MCP_CLUSTER_OPENSTACK_URL:http://localhost:8003}
              endpoint: /mcp

server:
  port: 8080
