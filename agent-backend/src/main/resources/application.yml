spring:
  application:
    name: aiops-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:ollama}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
    mcp:
      client:
        type: SYNC
        streamable-http:
          connections:
            metrics:
              url: ${MCP_METRICS_URL:http://localhost:8002}
              endpoint: /mcp
            infra:
              url: ${MCP_INFRA_URL:http://localhost:8003}
              endpoint: /mcp

server:
  port: 8080
