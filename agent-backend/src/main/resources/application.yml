spring:
  application:
    name: aiops-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:ollama}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
    mcp:
      client:
        type: SYNC
        sse:
          connections:
            metrics:
              url: ${MCP_METRICS_URL:http://localhost:8002}
              sse-endpoint: /sse
            infra:
              url: ${MCP_INFRA_URL:http://localhost:8003}
              sse-endpoint: /sse

agent:
  watch-seconds: ${AGENT_WATCH_SECONDS:0}

server:
  port: 8080
