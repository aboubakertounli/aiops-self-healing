# Run on the AIOps-Agent VM, not inside the cluster.
# Copy a kubeconfig that uses the k8s-cluster-openstack ServiceAccount to ./kubeconfig
# and point PROMETHEUS_URL at a worker NodePort (30090).

services:
  k8s-container-metrics:
    image: ${MCP_CONTAINER_METRICS_IMAGE:-registry.gitlab.com/aboubakertounli/aiops-self-healing-agent/k8s-container-metrics:latest}
    build:
      context: ..
      dockerfile: mcp-server-metrics/Dockerfile
    environment:
      PORT: "8002"
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://127.0.0.1:30090}
    ports:
      - "8002:8002"
    restart: unless-stopped

  k8s-cluster-openstack:
    image: ${MCP_CLUSTER_OPENSTACK_IMAGE:-registry.gitlab.com/aboubakertounli/aiops-self-healing-agent/k8s-cluster-openstack:latest}
    build:
      context: ..
      dockerfile: mcp-server-infra/Dockerfile
    environment:
      PORT: "8003"
      KUBECONFIG: /root/.kube/config
      RESTART_NAMESPACES: ${RESTART_NAMESPACES:-}
      RESTART_COOLDOWN_SECONDS: ${RESTART_COOLDOWN_SECONDS:-300}
      OS_CLOUD: ${OS_CLOUD:-}
    volumes:
      - ${KUBECONFIG_FILE:-./kubeconfig}:/root/.kube/config:ro
    ports:
      - "8003:8003"
    restart: unless-stopped

  aiops-agent:
    image: ${AGENT_IMAGE:-registry.gitlab.com/aboubakertounli/aiops-self-healing-agent/aiops-agent:latest}
    build:
      context: ..
      dockerfile: agent-backend/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      MCP_CONTAINER_METRICS_URL: http://k8s-container-metrics:8002
      MCP_CLUSTER_OPENSTACK_URL: http://k8s-cluster-openstack:8003
    ports:
      - "8080:8080"
    depends_on:
      - k8s-container-metrics
      - k8s-cluster-openstack
    restart: unless-stopped
