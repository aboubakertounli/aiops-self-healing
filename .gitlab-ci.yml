stages:
  - test
  - build

test:
  stage: test
  image: python:3.12
  script:
    - python -m unittest discover -s tests -v

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -f mcp-server-metrics/Dockerfile -t "$CI_REGISTRY_IMAGE/k8s-container-metrics:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/k8s-container-metrics:latest" .
    - docker build -f mcp-server-infra/Dockerfile -t "$CI_REGISTRY_IMAGE/k8s-cluster-openstack:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/k8s-cluster-openstack:latest" .
    - docker build -f agent-backend/Dockerfile -t "$CI_REGISTRY_IMAGE/aiops-agent:$CI_COMMIT_SHORT_SHA" -t "$CI_REGISTRY_IMAGE/aiops-agent:latest" .
    - docker push "$CI_REGISTRY_IMAGE/k8s-container-metrics:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/k8s-container-metrics:latest"
    - docker push "$CI_REGISTRY_IMAGE/k8s-cluster-openstack:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/k8s-cluster-openstack:latest"
    - docker push "$CI_REGISTRY_IMAGE/aiops-agent:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/aiops-agent:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
