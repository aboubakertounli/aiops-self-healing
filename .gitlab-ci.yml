stages:
  - test
  - build

test:
  stage: test
  image: python:3.12
  script:
    - python -m unittest discover -s tests -v

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker build -f mcp-server-docker/Dockerfile -t "$CI_REGISTRY_IMAGE/mcp-docker:$CI_COMMIT_SHORT_SHA" .
    - docker build -f mcp-server-metrics/Dockerfile -t "$CI_REGISTRY_IMAGE/mcp-metrics:$CI_COMMIT_SHORT_SHA" .
    - docker build -f mcp-server-infra/Dockerfile -t "$CI_REGISTRY_IMAGE/mcp-infra:$CI_COMMIT_SHORT_SHA" .
    - docker build -f agent-backend/Dockerfile -t "$CI_REGISTRY_IMAGE/aiops-agent:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/mcp-docker:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/mcp-metrics:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/mcp-infra:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/aiops-agent:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
