# Asks Nova which instances exist, then builds the master and workers groups
# used by site.yml. Install the collection first:
#   ansible-galaxy collection install -r requirements.yml
#
# Export OS_AUTH_URL, OS_USERNAME, OS_PASSWORD, OS_PROJECT_NAME,
# OS_USER_DOMAIN_NAME and OS_PROJECT_DOMAIN_NAME, or use a clouds.yaml.
# OS_AUTH_URL is the Keystone URL. With Kolla that is the VIP,
# not a fixed address chosen on the controller.
#
# When launching each instance, set the metadata key k8s_role:
#   master   -> group master
#   worker   -> group workers
#   workers  -> group workers
#
# The plugin sets ansible_host itself: the floating IP when there is one,
# otherwise the first fixed IP, which is the provider address here.
# expand_hostvars stays off because it queries Cinder, which Kolla does not install.
plugin: openstack.cloud.openstack
expand_hostvars: false
fail_on_errors: true
groups:
  master: openstack.metadata.k8s_role | default('') == 'master'
  workers: openstack.metadata.k8s_role | default('') in ['worker', 'workers']
compose:
  ansible_user: "'ubuntu'"
  ansible_python_interpreter: "'/usr/bin/python3'"
