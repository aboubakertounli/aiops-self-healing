apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mcp-docker
  namespace: aiops
spec:
  selector:
    matchLabels:
      app: mcp-docker
  template:
    metadata:
      labels:
        app: mcp-docker
    spec:
      containers:
        - name: mcp-docker
          image: mcp-docker
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-docker
  namespace: aiops
spec:
  selector:
    app: mcp-docker
  ports:
    - port: 8001
      targetPort: 8001
