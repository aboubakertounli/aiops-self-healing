apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-metrics
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-metrics
  template:
    metadata:
      labels:
        app: mcp-metrics
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mcp-metrics
          image: mcp-metrics
          ports:
            - containerPort: 8002
          env:
            - name: PORT
              value: "8002"
            - name: PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-metrics
  namespace: aiops
spec:
  selector:
    app: mcp-metrics
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-infra
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-infra
  template:
    metadata:
      labels:
        app: mcp-infra
    spec:
      serviceAccountName: mcp-infra
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mcp-infra
          image: mcp-infra
          ports:
            - containerPort: 8003
          env:
            - name: PORT
              value: "8003"
            - name: OS_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: openstack-clouds
                  key: OS_AUTH_URL
                  optional: true
            - name: OS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: openstack-clouds
                  key: OS_USERNAME
                  optional: true
            - name: OS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openstack-clouds
                  key: OS_PASSWORD
                  optional: true
            - name: OS_PROJECT_NAME
              valueFrom:
                secretKeyRef:
                  name: openstack-clouds
                  key: OS_PROJECT_NAME
                  optional: true
            - name: OS_USER_DOMAIN_NAME
              value: Default
            - name: OS_PROJECT_DOMAIN_NAME
              value: Default
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-infra
  namespace: aiops
spec:
  selector:
    app: mcp-infra
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-agent
  template:
    metadata:
      labels:
        app: aiops-agent
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: aiops-agent
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm
                  key: OPENAI_API_KEY
            - name: MCP_METRICS_URL
              value: http://mcp-metrics.aiops.svc:8002
            - name: MCP_INFRA_URL
              value: http://mcp-infra.aiops.svc:8003
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-agent
  namespace: aiops
spec:
  selector:
    app: aiops-agent
  ports:
    - port: 8080
      targetPort: 8080
