apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - mcp-docker.yaml
  - agent.yaml
  - fluent-bit.yaml
  - monitoring.yaml
images:
  - name: mcp-docker
    newName: docker.io/aboubakertounli/mcp-docker
    newTag: dev
  - name: mcp-metrics
    newName: docker.io/aboubakertounli/mcp-metrics
    newTag: dev
  - name: mcp-infra
    newName: docker.io/aboubakertounli/mcp-infra
    newTag: dev
  - name: aiops-agent
    newName: docker.io/aboubakertounli/aiops-agent
    newTag: dev
