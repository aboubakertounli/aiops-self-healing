apiVersion: v1
kind: Namespace
metadata:
  name: aiops
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-infra
  namespace: aiops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-infra-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-infra-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-infra-read
subjects:
  - kind: ServiceAccount
    name: mcp-infra
    namespace: aiops
