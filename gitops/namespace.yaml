apiVersion: v1
kind: Namespace
metadata:
  name: token-for-agent
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-cluster-openstack
  namespace: token-for-agent
---
# Long-lived token copied onto the agent VM as a kubeconfig.
#   kubectl -n token-for-agent get secret k8s-cluster-openstack-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: k8s-cluster-openstack-token
  namespace: token-for-agent
  annotations:
    kubernetes.io/service-account.name: k8s-cluster-openstack
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-cluster-openstack
rules:
  - apiGroups: [""]
    resources: ["nodes", "events", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-cluster-openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-cluster-openstack
subjects:
  - kind: ServiceAccount
    name: k8s-cluster-openstack
    namespace: token-for-agent
