apiVersion: v1
kind: Namespace
metadata:
  name: aiops
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-infra
  namespace: aiops
---
# Long-lived token copied onto the agent VM as a kubeconfig.
#   kubectl -n aiops get secret mcp-infra-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: mcp-infra-token
  namespace: aiops
  annotations:
    kubernetes.io/service-account.name: mcp-infra
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-infra-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "events", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-infra-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mcp-infra-read
subjects:
  - kind: ServiceAccount
    name: mcp-infra
    namespace: aiops
