apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: monitoring
  releaseName: kube-prometheus-stack
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 24h
  values:
    grafana:
      adminPassword: admin
      service:
        type: NodePort
        nodePort: 30000
    prometheus:
      service:
        type: NodePort
        nodePort: 30090
      prometheusSpec:
        retention: 3d
        ruleSelectorNilUsesHelmValues: false
    alertmanager:
      config:
        route:
          receiver: aiops-agent
          group_by: ["alertname", "namespace", "pod"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 2h
          routes:
            - receiver: "null"
              matchers:
                - alertname = Watchdog
        receivers:
          - name: "null"
          - name: aiops-agent
            webhook_configs:
              # Replace AGENT_VM_IP with the address Nova gave AIOps-Agent.
              - url: http://AGENT_VM_IP:8080/api/alerts
                send_resolved: true
